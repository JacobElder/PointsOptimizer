[pytest]
# Unknown marks are typos, not features.
addopts = --strict-markers --strict-config
# Warnings are errors so a deprecation in streamlit, numpy or fast-flights surfaces
# here rather than in the daily run. Known third-party noise is listed explicitly
# so the list stays short and reviewable.
filterwarnings =
    error
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:google.*
