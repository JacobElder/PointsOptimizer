name: Google probe

# Why Google Flights answers GitHub's runners with empty pages (since Oct 10 2026),
# and whether a different request style gets fares. Google only: no seats.aero calls,
# no email, no commits. The saved pages are in the run's artifacts.
#
# Oct 16 01:12 UTC: 77-83% of the previous morning's empty lookups priced, paced or
# not, while every daily run since Oct 10 (13:25-16:07 UTC) lost 17-55%. The schedule
# tests time of day: compare the Summary lines by start time. Remove it once decided.
on:
  schedule:
    - cron: "40 1 * * *"
    - cron: "40 7 * * *"
    - cron: "40 13 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "Lookups per variant"
        default: "30"
      pause:
        description: "Seconds between lookups (the daily run uses 0)"
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/google_probe.py --n "${{ inputs.n || '30' }}" --pause "${{ inputs.pause || '1' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-probe-pages
          path: probe_out/
          if-no-files-found: ignore
