name: Tests

on:
  push:
    branches: [main]
    paths-ignore: [".github/run-request"]  # the backup trigger, not a code change
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026 (actions/runner-images#14748).
    # Move deliberately, with a test run, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches CI history; 3.13 is what Streamlit Community Cloud runs.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest -q
