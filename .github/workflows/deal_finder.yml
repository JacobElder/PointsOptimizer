name: Deal Finder

# Daily: scan seats.aero on scan_config.json's routes, price the most promising
# awards with free Google Flights fares, email NEW standouts, and commit the
# digest (shown on the Deal Radar page) plus the saved cash quotes.
#
# Needs repo secrets: SEATS_AERO_API_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD
# (SERPAPI_KEY optional: capped fallback if free lookups fail; PROGRAM_BALANCES
# optional: miles already held in airline programs, kept out of the public repo).
#
# Starting it: GitHub's scheduler has been dropping scheduled runs since late Aug 2026
# (github.com/orgs/community/discussions/207346; this repo got none on Sep 28-29), so
# there are three layers, and every layer after the first exits at once if today's
# digest already exists:
#   1. the two cron slots below;
#   2. cron-job.org calling workflow_dispatch with backup=true (14:00 UTC);
#   3. a Claude routine (16:00 UTC) that pushes a line to .github/run-request, which
#      needs no token because the routine can already push to this repo.
# A plain manual "Run workflow" (backup unticked) always runs.
on:
  schedule:
    # Off the top of the hour, where scheduler load peaks.
    - cron: "17 8 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      resend:
        description: "Email all current deals, even ones already sent (for testing)"
        type: boolean
        default: false
      backup:
        description: "Backup trigger: skip if today's digest already exists"
        type: boolean
        default: false
  push:
    # Any branch: the routine may only be allowed to push to claude/* branches.
    # The job always checks out and commits to main regardless.
    paths: [".github/run-request"]

concurrency:
  group: deal-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026 (actions/runner-images#14748).
    # Move deliberately, with a test run, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # a run requested from a claude/* branch still works on main
      # Scheduled and backup runs: skip when today's digest already exists (another
      # layer got there first). A second full scan would spend another ~500 of the
      # 1,000 seats.aero calls a day shared with your own searches, and re-email
      # nothing new. Checkout happens when the job starts, so a run queued behind
      # another (same concurrency group) sees the digest it just pushed.
      # A plain manual run always goes ahead.
      - name: Already ran today?
        id: guard
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.backup
        run: |
          today=$(date -u +%Y-%m-%d)
          made=$(python3 -c "import json; print(json.load(open('deal_digest.json')).get('generated_at', '')[:10])" 2>/dev/null || true)
          if [ "$made" = "$today" ]; then
            echo "Today's digest already exists ($made); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Check secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$SEATS_AERO_API_KEY" ]; then
            echo "::error::Add the SEATS_AERO_API_KEY repo secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Without these the run stays green and silently sends nothing, which is
          # indistinguishable from "no deals today".
          if [ -z "$GMAIL_ADDRESS" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::GMAIL_ADDRESS / GMAIL_APP_PASSWORD are missing, so no digest email can be sent."
            exit 1
          fi
      - name: Find deals
        if: steps.guard.outputs.skip != 'true'
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }} # optional: balances from your private Gist (see README)
          PROGRAM_BALANCES: ${{ secrets.PROGRAM_BALANCES }} # fallback when GIST_TOKEN isn't set
        run: python deal_finder.py ${{ inputs.resend && '--resend' || '' }}
      - name: Commit digest and quotes
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Deal Radar bot"
          git config user.email "deal-radar-bot@users.noreply.github.com"
          # Never commit a file that doesn't parse: a truncated write, or a clean
          # line-level rebase merge of two runs' output, would be pushed to the
          # public repo and read by the site.
          for f in deal_digest.json cash_quotes.json award_history.json program_taxes.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || {
              echo "::error::$f is not valid JSON; refusing to commit it."; exit 1; }
          done
          git add deal_digest.json cash_quotes.json award_history.json program_taxes.json
          git diff --cached --quiet && exit 0
          git commit -m "Deal Finder: daily digest [skip ci]"
          # deal_digest.json is regenerated output, so on a conflict this run's copy
          # wins. The other three are CUMULATIVE stores -- saved quotes, price
          # history, and hand-curated tax figures -- so preferring this run's copy
          # can discard work done elsewhere. Acceptable today because only this
          # workflow writes them in CI, but a local `make find` or a hand edit
          # landing in the same window would be lost.
          cp deal_digest.json /tmp/digest.json
          cp cash_quotes.json /tmp/quotes.json
          cp award_history.json /tmp/history.json
          cp program_taxes.json /tmp/taxes.json
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/digest.json deal_digest.json
              cp /tmp/quotes.json cash_quotes.json
              cp /tmp/history.json award_history.json
              cp /tmp/taxes.json program_taxes.json
              git add deal_digest.json cash_quotes.json award_history.json program_taxes.json
              git diff --cached --quiet && exit 0
              git commit -m "Deal Finder: daily digest [skip ci]"
            fi
          done
          echo "::error::Could not push the digest after 4 attempts."
          exit 1
