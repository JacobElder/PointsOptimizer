name: Cash price source check

# Verifies free Google Flights lookups (fast-flights) work from GitHub's runners.
# Never spends SerpApi quota. Runs weekly, on changes to the provider code, or by hand.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1" # weekly (Mon): catch Google page changes that break parsing
  push:
    branches: [main]
    paths:
      - flight_search.py
      - cash_price_check.py
      - requirements-pipeline.txt
      - .github/workflows/cash_price_check.yml

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026 (actions/runner-images#14748).
    # Move deliberately, with a test run, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt
      - run: python cash_price_check.py
